name: Sync Upstream & Release

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specific upstream tag (e.g. v0.2.82); leave empty for latest'
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest upstream release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            UPSTREAM_TAG="${INPUT_TAG}"
          else
            UPSTREAM_TAG=$(gh api repos/lihuanyu0w0/collie/releases/latest --jq '.tag_name')
          fi
          if [[ ! "${UPSTREAM_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid upstream tag: ${UPSTREAM_TAG}" >&2
            exit 1
          fi
          echo "tag=${UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"

          DRAFT=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${UPSTREAM_TAG}" --jq '.draft' 2>/dev/null || echo "missing")
          if [ "${DRAFT}" = "false" ]; then
            echo "Release ${UPSTREAM_TAG} is already published on ${GITHUB_REPOSITORY}; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Need to sync and publish ${UPSTREAM_TAG}."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout fork main
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream tag into main
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/lihuanyu0w0/collie.git 2>/dev/null || \
            git remote set-url upstream https://github.com/lihuanyu0w0/collie.git
          git fetch --no-tags upstream "refs/tags/${TAG}:refs/tags/upstream-${TAG}"

          if git merge-base --is-ancestor "refs/tags/upstream-${TAG}" HEAD; then
            echo "main already includes ${TAG}"
            exit 0
          fi

          if ! git merge --no-edit -m "chore: sync upstream ${TAG}" "refs/tags/upstream-${TAG}"; then
            CONFLICTS=$(git diff --name-only --diff-filter=U | sed 's/^/- /' || true)
            git merge --abort || true
            TITLE="[Auto-Sync] Merge conflict syncing upstream ${TAG}"
            OPEN=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "\"${TITLE}\" in:title" --json number --jq 'length')
            if [ "${OPEN}" = "0" ]; then
              gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body "$(cat <<EOF
          Automatic merge of upstream \`lihuanyu0w0/collie\` tag \`${TAG}\` into \`main\` hit a merge conflict and was aborted cleanly.

          ### Conflicting files
          ${CONFLICTS:-"(see workflow logs)"}

          ### How to resolve locally
          \`\`\`bash
          git fetch upstream --tags
          git merge upstream/${TAG}
          # resolve conflicts, run go test ./..., then:
          git push origin main
          \`\`\`
          After pushing \`main\`, re-run the **Sync Upstream & Release** workflow with tag \`${TAG}\`.
          EOF
          )"
            fi
            exit 1
          fi

      - name: Setup Go
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run fork unit tests
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -euo pipefail
          if ! go test -v ./internal/collie -run 'Test(ParseClaudeSGBridgeArgs|SafePaneFileNameAndSessionID|FindTranscriptClaudeSG|ClaudeModelsWithClaudeSGLauncher|ParseClaudeStartRPC|AgentMissingWithClaudeSGLauncher|HandleHerdrStream|ForkReleaseRepoURL|NodeAssistedHubSelfUpdate)'; then
            TITLE="[Auto-Sync] Tests failed syncing upstream ${TAG}"
            OPEN=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "\"${TITLE}\" in:title" --json number --jq 'length')
            if [ "${OPEN}" = "0" ]; then
              gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body "Merged \`${TAG}\` locally in CI, but fork unit tests failed. Nothing was pushed to \`main\`. Check the failed workflow run logs for details."
            fi
            exit 1
          fi

      - name: Build cross-platform release binaries
        if: steps.check.outputs.skip != 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            out="dist/collie-${os}-${arch}"
            echo "Building ${out} (${TAG})"
            GOOS="${os}" GOARCH="${arch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "${out}" .
          done
          (cd dist && sha256sum collie-* > checksums.txt)
          cat dist/checksums.txt

      - name: Push main, tag, and publish GitHub Release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git push origin main; then
            TITLE="[Auto-Sync] Manual push needed for upstream ${TAG}"
            OPEN=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "\"${TITLE}\" in:title" --json number --jq 'length')
            if [ "${OPEN}" = "0" ]; then
              gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body "Merged \`${TAG}\` and verified tests in CI, but pushing \`main\` failed (for example if upstream modified \`.github/workflows/\`, which \`GITHUB_TOKEN\` cannot push). Please merge and push locally, then re-run this workflow."
            fi
            exit 1
          fi

          git tag -fa "${TAG}" -m "Collie ${TAG} (fork auto-sync)"
          git push -f origin "refs/tags/${TAG}"

          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.parse, urllib.request

          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          notes = (
              f"Auto-synced with upstream `lihuanyu0w0/collie` `{tag}` + `claude-sg` Docker bridge.\n\n"
              "Supports one-click self-update from Collie UI for both Hub and Mac Node."
          )

          def api(method, url, data=None, ctype="application/json"):
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "collie-fork-auto-sync",
              }
              if data is not None:
                  headers["Content-Type"] = ctype
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=180) as resp:
                      raw = resp.read()
                      return json.loads(raw.decode("utf-8")) if raw else None
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  raise SystemExit(f"ERROR: {method} {url} -> HTTP {e.code}: {body}") from None

          releases = api("GET", f"https://api.github.com/repos/{repo}/releases?per_page=30")
          matches = [r for r in releases if r.get("tag_name") == tag]
          rel = next((r for r in matches if not r.get("draft")), matches[0] if matches else None)
          if rel is None:
              rel = api(
                  "POST",
                  f"https://api.github.com/repos/{repo}/releases",
                  json.dumps({
                      "tag_name": tag,
                      "name": f"Collie {tag}",
                      "body": notes,
                      "draft": True,
                      "prerelease": False,
                  }).encode(),
              )

          rel_id = rel["id"]
          existing = {a["name"]: a["id"] for a in rel.get("assets", [])}
          upload_base = rel["upload_url"].split("{", 1)[0]
          assets = [
              "collie-darwin-arm64",
              "collie-darwin-amd64",
              "collie-linux-amd64",
              "collie-linux-arm64",
              "checksums.txt",
          ]
          for name in assets:
              if name in existing:
                  api("DELETE", f"https://api.github.com/repos/{repo}/releases/assets/{existing[name]}")
              payload = (pathlib.Path("dist") / name).read_bytes()
              query = urllib.parse.urlencode({"name": name})
              res = api("POST", f"{upload_base}?{query}", payload, ctype="application/octet-stream")
              print(f"uploaded {res['name']} ({res['size']} bytes)")

          checked = api("GET", f"https://api.github.com/repos/{repo}/releases/{rel_id}")
          by_name = {a["name"]: a for a in checked.get("assets", [])}
          bad = [n for n in assets if n not in by_name or by_name[n].get("state") != "uploaded" or (by_name[n].get("size") or 0) <= 0]
          if bad:
              raise SystemExit(f"Asset verification failed: {bad}")

          if checked.get("draft"):
              pub = api("PATCH", f"https://api.github.com/repos/{repo}/releases/{rel_id}", json.dumps({"draft": False}).encode())
              if pub.get("draft"):
                  raise SystemExit("Release stayed in draft state")
          print(f"Published {tag} on {repo}")
          PY
